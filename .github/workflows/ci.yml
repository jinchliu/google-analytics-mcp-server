name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so a tag is gated by exactly these checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv reads .python-version; keep the version visible in the workflow too.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true

      # Fail when uv.lock and pyproject.toml disagree.
      - run: uv sync --locked

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

      # Offline by default: no ADC, live API calls or credentials in CI.
      - run: uv run pytest --cov=google_analytics_mcp_server --cov-report=term-missing
